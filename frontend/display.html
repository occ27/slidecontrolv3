<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Telão de Projeção — SlideControl V3</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/display.css">
  <link rel="stylesheet" href="css/text-models.css">
</head>
<body>
  <!-- Background Viewport -->
  <div class="bg-viewport">
    <div class="bg-solid" id="bg-solid"></div>
    <div class="bg-gradient" id="bg-gradient"></div>
    <div class="bg-image" id="bg-image"></div>
    <video class="bg-video" id="bg-video" autoplay loop muted playsinline></video>
  </div>

  <!-- Content Presentation Layer -->
  <main class="content-layer" id="content-layer">
    <div class="header-badge" id="slide-header" style="display: none;">JOÃO 3:16</div>
    <h1 class="slide-text" id="slide-text">SlideControl V3 Orbital</h1>
    <div class="slide-subtitle" id="slide-subtitle">Aguardando comando da cabine de projeção...</div>
  </main>

  <!-- Emergency Blackout Layer -->
  <div class="blackout-layer" id="blackout-layer"></div>

  <!-- Logo Projection Layer -->
  <div class="logo-layer" id="logo-layer">
    <div class="logo-text">SLIDECONTROL V3</div>
  </div>

  <!-- Alert Overlay Banner -->
  <aside class="alert-overlay" id="alert-overlay">
    <span class="alert-badge">AVISO</span>
    <span class="alert-msg" id="alert-msg">Mensagem de aviso</span>
  </aside>

  <script>
    // Communication with Main Console via BroadcastChannel
    const channel = new BroadcastChannel('slidecontrol_orbital_v3');

    const contentLayer = document.getElementById('content-layer');
    const headerEl = document.getElementById('slide-header');
    const textEl = document.getElementById('slide-text');
    const subtitleEl = document.getElementById('slide-subtitle');
    const blackoutEl = document.getElementById('blackout-layer');
    const logoEl = document.getElementById('logo-layer');
    const alertOverlay = document.getElementById('alert-overlay');
    const alertMsg = document.getElementById('alert-msg');
    const bgSolid = document.getElementById('bg-solid');
    const bgGradient = document.getElementById('bg-gradient');
    const bgImage = document.getElementById('bg-image');
    const bgVideo = document.getElementById('bg-video');

    let currentBg = {
      kind: null,
      url: null
    };
    let currentTextStyle = 'ts-holy-default';
    let alertTimeout = null;

    function normalizeMediaUrl(url) {
      if (!url) return '';
      try {
        return decodeURIComponent(url).trim();
      } catch (e) {
        return String(url).trim();
      }
    }

    function applyBackground(kind, url) {
      if (!kind || !url) return;

      const normNew = normalizeMediaUrl(url);
      const normCur = normalizeMediaUrl(currentBg.url);

      // Se for a mesma mídia já em reprodução, mantém tocando em loop sem reiniciar
      if (currentBg.kind === kind && normCur === normNew) {
        if (kind === "video" && bgVideo && bgVideo.paused) {
          bgVideo.play().catch(() => {});
        }
        return;
      }

      currentBg.kind = kind;
      currentBg.url = url;

      if (kind === "color") {
        if (bgSolid) {
          bgSolid.style.backgroundColor = url || "#000000";
          bgSolid.style.opacity = "1";
        }
        if (bgImage) bgImage.style.opacity = "0";
        if (bgVideo) {
          bgVideo.style.opacity = "0";
          bgVideo.classList.remove("active");
          bgVideo.pause();
        }
      } else if (kind === "image") {
        if (bgImage) {
          bgImage.style.backgroundImage = `url("${url}")`;
          bgImage.style.opacity = "1";
        }
        if (bgVideo) {
          bgVideo.style.opacity = "0";
          bgVideo.classList.remove("active");
          bgVideo.pause();
        }
      } else if (kind === "video") {
        if (bgVideo) {
          bgVideo.src = url;
          bgVideo.loop = true;
          bgVideo.style.opacity = "1";
          bgVideo.classList.add("active");
          bgVideo.play().catch(() => {});
        }
        if (bgImage) bgImage.style.opacity = "0";
      }
    }

    function applyTextStyle(data) {
      if (!data) return;

      if (data.textStyle !== undefined && data.textStyle) {
        currentTextStyle = data.textStyle;
        const classes = Array.from(contentLayer.classList);
        classes.forEach(c => {
          if (c.startsWith('ts-')) contentLayer.classList.remove(c);
        });
        contentLayer.classList.add(data.textStyle);
      }

      if (data.fontFamily !== undefined) {
        textEl.style.fontFamily = data.fontFamily || '';
      }

      if (data.fontWeight !== undefined) {
        textEl.style.fontWeight = data.fontWeight || '';
      }

      if (data.fontSize !== undefined) {
        textEl.style.fontSize = data.fontSize ? `${data.fontSize}px` : '';
      }

      if (data.captionFontSize !== undefined && data.captionFontSize) {
        headerEl.style.fontSize = data.captionFontSize;
        subtitleEl.style.fontSize = data.captionFontSize;
      }

      if (data.linesLimit !== undefined) {
        const limit = parseInt(data.linesLimit) || 0;
        if (limit > 0) {
          textEl.style.display = '-webkit-box';
          textEl.style.webkitLineClamp = limit;
          textEl.style.webkitBoxOrient = 'vertical';
          textEl.style.overflow = 'hidden';
        } else {
          textEl.style.display = '';
          textEl.style.webkitLineClamp = '';
          textEl.style.webkitBoxOrient = '';
          textEl.style.overflow = '';
        }
      }
    }

    function triggerTextAnimation() {
      if (currentTextStyle === 'ts-news-lower-third') {
        contentLayer.style.animation = 'none';
        contentLayer.offsetHeight;
        contentLayer.style.animation = 'newsSlideIn 1.2s cubic-bezier(0.19, 1, 0.22, 1) forwards';
      } else if (currentTextStyle === 'ts-glass-reveal') {
        contentLayer.style.animation = 'none';
        contentLayer.offsetHeight;
        contentLayer.style.animation = 'glassRise 1.0s cubic-bezier(0.16, 1, 0.3, 1) forwards';
      } else if (currentTextStyle === 'ts-magic-reveal') {
        contentLayer.style.animation = 'none';
        contentLayer.offsetHeight;
        contentLayer.style.animation = 'magicWipe 1.2s cubic-bezier(0.2, 1, 0.3, 1) forwards';
      } else {
        contentLayer.style.animation = 'none';
        contentLayer.offsetHeight;
        contentLayer.style.animation = 'textFadeIn 0.35s cubic-bezier(0.4, 0, 0.2, 1) forwards';
      }
    }

    function applyBgFit(fitMode) {
      if (bgImage) {
        if (fitMode === 'cover') bgImage.style.backgroundSize = 'cover';
        else if (fitMode === 'contain') bgImage.style.backgroundSize = 'contain';
        else if (fitMode === 'stretch') bgImage.style.backgroundSize = '100% 100%';
        else if (fitMode === 'width') bgImage.style.backgroundSize = '100% auto';
      }

      if (bgVideo) {
        if (fitMode === 'cover') bgVideo.style.objectFit = 'cover';
        else if (fitMode === 'contain') bgVideo.style.objectFit = 'contain';
        else if (fitMode === 'stretch') bgVideo.style.objectFit = 'fill';
        else if (fitMode === 'width') bgVideo.style.objectFit = 'cover';
      }
      
      const logoImg = document.getElementById('logo-img');
      if (logoImg) {
        if (fitMode === 'cover') logoImg.style.objectFit = 'cover';
        else if (fitMode === 'contain') logoImg.style.objectFit = 'contain';
        else if (fitMode === 'stretch') logoImg.style.objectFit = 'fill';
        else if (fitMode === 'width') logoImg.style.objectFit = 'cover';
      }
    }

    // Restaura background inicial das preferências se existir
    if (window.electronAPI && typeof window.electronAPI.getPref === "function") {
      try {
        const initKind = window.electronAPI.getPref("slideState_bgKind");
        const initUrl = window.electronAPI.getPref("slideState_bgUrl");
        if (initKind && initUrl) {
          applyBackground(initKind, initUrl);
        }
        
        const initLogoUrl = window.electronAPI.getPref("slideState_logoUrl");
        if (initLogoUrl) {
          const fitMode = window.electronAPI.getPref('slideState_bgFit_telao') || 'cover';
          let objectFit = 'cover';
          if (fitMode === 'contain') objectFit = 'contain';
          else if (fitMode === 'stretch') objectFit = 'fill';
          logoEl.innerHTML = `<img id="logo-img" src="${initLogoUrl}" style="width: 100vw; height: 100vh; object-fit: ${objectFit}; max-width: none; max-height: none; filter: none;">`;
        }

        // Restaura estilo de texto inicial das preferências
        applyTextStyle({
          textStyle: window.electronAPI.getPref('slideState_textStyle') || 'ts-holy-default',
          fontFamily: window.electronAPI.getPref('slideState_fontFamily') || '',
          fontWeight: window.electronAPI.getPref('slideState_fontWeight') || '',
          fontSize: parseInt(window.electronAPI.getPref('slideState_fontSize')) || 52,
          captionFontSize: window.electronAPI.getPref('slideState_captionFontSize') || 'clamp(13px, 1.4vw, 22px)',
          linesLimit: window.electronAPI.getPref('slideState_linesLimit') || '0'
        });
      } catch (err) {
        console.warn('Erro ao restaurar preferências do telão:', err);
      }
    }

    const initialFit = (window.electronAPI && window.electronAPI.getPref('slideState_bgFit_telao')) || 'width';
    applyBgFit(initialFit);

    channel.onmessage = (event) => {
      const msg = event.data;
      if (!msg) return;

      switch (msg.action) {
        case 'PROJECT_SLIDE':
          if (typeof msg.isBlackout !== 'undefined') {
            blackoutEl.classList.toggle('active', !!msg.isBlackout);
          }
          if (typeof msg.isLogo !== 'undefined') {
            logoEl.classList.toggle('active', !!msg.isLogo);
          }
          if (typeof msg.isClearText !== 'undefined') {
            contentLayer.classList.toggle('text-hidden', !!msg.isClearText);
          }

          if (msg.header) {
            headerEl.textContent = msg.header;
            headerEl.style.display = 'inline-block';
          } else {
            headerEl.style.display = 'none';
          }

          textEl.textContent = msg.text || '';
          subtitleEl.textContent = msg.subtitle || '';

          if (msg.theme === 'bible') {
            bgGradient.style.background = 'radial-gradient(circle at center, #1e1b4b 0%, #030712 100%)';
            headerEl.style.color = '#a855f7';
            headerEl.style.borderColor = 'rgba(168, 85, 247, 0.4)';
          } else if (msg.theme === 'song') {
            bgGradient.style.background = 'radial-gradient(circle at center, #0f2c42 0%, #020617 100%)';
            headerEl.style.color = '#00f0ff';
            headerEl.style.borderColor = 'rgba(0, 240, 255, 0.4)';
          } else {
            bgGradient.style.background = 'radial-gradient(circle at center, #111827 0%, #030712 100%)';
            headerEl.style.color = '#10b981';
            headerEl.style.borderColor = 'rgba(16, 185, 129, 0.4)';
          }

          if (msg.bgKind && msg.bgUrl) {
            applyBackground(msg.bgKind, msg.bgUrl);
          }

          if (msg.textStyle) {
            applyTextStyle({
              textStyle: msg.textStyle,
              fontFamily: msg.fontFamily,
              fontWeight: msg.fontWeight,
              fontSize: msg.fontSize,
              captionFontSize: msg.captionFontSize,
              linesLimit: msg.linesLimit
            });
          }

          triggerTextAnimation();
          break;

        case 'TOGGLE_BLACKOUT':
          blackoutEl.classList.toggle('active', msg.active);
          break;

        case 'TOGGLE_CLEAR_TEXT':
          contentLayer.classList.toggle('text-hidden', msg.active);
          break;

        
        case 'SET_LOGO':
          const fitMode = window.electronAPI ? window.electronAPI.getPref('slideState_bgFit_telao') || 'cover' : 'cover';
          let objectFit = 'cover';
          if (fitMode === 'contain') objectFit = 'contain';
          else if (fitMode === 'stretch') objectFit = 'fill';
          logoEl.innerHTML = `<img id="logo-img" src="${msg.url}" style="width: 100vw; height: 100vh; object-fit: ${objectFit}; max-width: none; max-height: none; filter: none;">`;
          break;

        case 'TOGGLE_LOGO':
          logoEl.classList.toggle('active', msg.active);
          break;

        case 'SHOW_ALERT':
          alertMsg.textContent = msg.text;
          alertOverlay.classList.add('visible');

          if (alertTimeout) clearTimeout(alertTimeout);
          alertTimeout = setTimeout(() => {
            alertOverlay.classList.remove('visible');
          }, (msg.duration || 10) * 1000);
          break;

        case 'CLEAR_ALERT':
          alertOverlay.classList.remove('visible');
          break;

        case 'SET_BACKGROUND':
          if (!msg.target || msg.target === 'telao') {
            applyBackground(msg.kind, msg.url);
          }
          break;
        case 'SET_BG_FIT':
          if (!msg.target || msg.target === 'telao') {
            applyBgFit(msg.value);
          }
          break;
        case 'SET_TEXT_STYLE':
          if (!msg.target || msg.target === 'telao') {
            applyTextStyle(msg);
          }
          break;
      }
    };

    // Notify console that display window is connected
    channel.postMessage({ action: 'DISPLAY_CONNECTED', timestamp: Date.now() });
  </script>
</body>
</html>
