<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Retorno de Palco — SlideControl Lumina</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/retorno.css">
  <link rel="stylesheet" href="css/text-models.css">
</head>
<body>
  <!-- Background Viewport -->
  <div class="bg-viewport">
    <div class="bg-solid" id="bg-solid"></div>
    <div class="bg-image" id="bg-image"></div>
    <video class="bg-video" id="bg-video" autoplay loop muted playsinline></video>
  </div>
  <div class="stage-dim-overlay"></div>

  <div class="stage-wrapper">
    <!-- Topbar -->
    <header class="stage-topbar">
      <span class="stage-badge" id="stage-header">SLIDECONTROL LUMINA</span>
      <time class="stage-clock" id="stage-clock">00:00:00</time>
    </header>

    <!-- Center: Slide Atual -->
    <main class="stage-center">
      <h1 class="stage-current-text" id="stage-current-text">Aguardando início...</h1>
    </main>

    <!-- Footer: Próximo Slide -->
    <footer class="stage-footer">
      <span class="stage-next-label">▶ PRÓXIMO:</span>
      <p class="stage-next-text" id="stage-next-text">—</p>
    </footer>
  </div>

  <!-- Camada de Blackout -->
  <div class="stage-blackout" id="stage-blackout"></div>

  <!-- Camada de Logo -->
  <div class="stage-logo" id="logo-layer"></div>

  <!-- Aviso de Palco -->
  <aside class="stage-alert-toast" id="stage-alert">
    <span id="stage-alert-text">Mensagem de Palco</span>
  </aside>

  <script>
    // Relógio em tempo real
    function updateClock() {
      const now = new Date();
      const h = String(now.getHours()).padStart(2, '0');
      const m = String(now.getMinutes()).padStart(2, '0');
      const s = String(now.getSeconds()).padStart(2, '0');
      document.getElementById('stage-clock').textContent = `${h}:${m}:${s}`;
    }
    setInterval(updateClock, 1000);
    updateClock();

    // BroadcastChannel para sincronização instantânea
    const channel = new BroadcastChannel('slidecontrol_orbital_v3');
    const headerEl = document.getElementById('stage-header');
    const currentEl = document.getElementById('stage-current-text');
    const nextEl = document.getElementById('stage-next-text');

    const bgSolid = document.getElementById('bg-solid');
    const bgImage = document.getElementById('bg-image');
    const bgVideo = document.getElementById('bg-video');

    let currentRetornoBg = {
      kind: null,
      url: null
    };

    function normalizeMediaUrl(url) {
      if (!url) return '';
      try {
        return decodeURIComponent(url).trim();
      } catch (e) {
        return String(url).trim();
      }
    }

    function applyRetornoBackground(kind, url) {
      if (!kind || !url) return;

      const normNew = normalizeMediaUrl(url);
      const normCur = normalizeMediaUrl(currentRetornoBg.url);

      // Se for a mesma mídia já em reprodução, mantém tocando em loop sem reiniciar
      if (currentRetornoBg.kind === kind && normCur === normNew) {
        if (kind === "video" && bgVideo && bgVideo.paused) {
          bgVideo.play().catch(() => {});
        }
        return;
      }

      currentRetornoBg.kind = kind;
      currentRetornoBg.url = url;

      if (kind === 'color') {
        if (bgSolid) {
          bgSolid.style.backgroundColor = url || '#000000';
          bgSolid.style.opacity = '1';
        }
        if (bgImage) bgImage.style.opacity = '0';
        if (bgVideo) {
          bgVideo.style.opacity = '0';
          bgVideo.classList.remove('active');
          bgVideo.pause();
        }
      } else if (kind === 'image') {
        if (bgImage) {
          bgImage.style.backgroundImage = `url("${url}")`;
          bgImage.style.opacity = '1';
        }
        if (bgVideo) {
          bgVideo.style.opacity = '0';
          bgVideo.classList.remove('active');
          bgVideo.pause();
        }
      } else if (kind === 'video') {
        if (bgVideo) {
          bgVideo.src = url;
          bgVideo.loop = true;
          bgVideo.style.opacity = '1';
          bgVideo.classList.add('active');
          bgVideo.play().catch(() => {});
        }
        if (bgImage) bgImage.style.opacity = '0';
      }
    }

    const stageWrapper = document.querySelector('.stage-wrapper');
    const topbarEl = document.querySelector('.stage-topbar');
    const centerEl = document.querySelector('.stage-center');
    const footerEl = document.querySelector('.stage-footer');

    let currentTextStyle = 'ts-holy-default';
    let lastEffectiveRetornoFontSize = 52;
    let lastCaptionFontSize = null;

    function formatDisplayText(rawText, textStyle) {
      if (!rawText) return '';
      let processed = String(rawText).replace(/(\w)-(\w)/g, '$1&#8209;$2');

      const isAnimatedWorship = textStyle === 'ts-worship-highlight-animated';
      const isRandomHighlight = textStyle === 'ts-worship-highlight-word';
      const isHandwritten = textStyle === 'ts-worship-handwritten';
      const isWorship = isAnimatedWorship || isRandomHighlight || isHandwritten;

      if (!isWorship) {
        return processed.replace(/\n/g, '<br/>');
      }

      const lines = processed.replace(/<br\s*\/?>/gi, '\n').split('\n').filter(l => l.trim() !== '');
      const importantWords = new Set(['deus', 'jesus', 'rei', 'maior', 'santo', 'pai', 'senhor', 'poder', 'amor', 'luz', 'paz', 'vida', 'cruz', 'fogo', 'amém', 'bom', 'fiel', 'justo', 'eterno', 'glória', 'graça', 'céu', 'digno', 'forte', 'vivo', 'leão', 'cristo', 'salvo', 'sangue', 'cura']);
      const cleanWord = (w) => w.trim().replace(/[^a-zA-ZÀ-ÿ]/g, '').toLowerCase();

      const importantLineIndices = [];
      const normalLineIndices = [];

      let tempVisibleCount = 0;
      lines.forEach((line) => {
        if (line.trim() !== '') {
          const words = line.split(' ');
          const hasImportantWord = words.some(w => importantWords.has(cleanWord(w)));
          if (hasImportantWord) {
            importantLineIndices.push(tempVisibleCount);
          } else {
            const hasValidLength = words.some(w => cleanWord(w).length > 2 && cleanWord(w).length <= 5);
            if (hasValidLength) {
              normalLineIndices.push(tempVisibleCount);
            }
          }
          tempVisibleCount++;
        }
      });

      const linesToHighlight = new Set();
      while (importantLineIndices.length > 0 && linesToHighlight.size < 2) {
        const randIdx = Math.floor(Math.random() * importantLineIndices.length);
        linesToHighlight.add(importantLineIndices[randIdx]);
        importantLineIndices.splice(randIdx, 1);
      }
      while (normalLineIndices.length > 0 && linesToHighlight.size < 2) {
        const randIdx = Math.floor(Math.random() * normalLineIndices.length);
        linesToHighlight.add(normalLineIndices[randIdx]);
        normalLineIndices.splice(randIdx, 1);
      }

      let visibleLineCount = 0;
      const htmlLines = lines.map(line => {
        if (line.trim() === '') return `<span>${line}</span>`;
        const type = visibleLineCount % 2 === 0 ? 'line-odd' : 'line-even';
        const currentVisibleIndex = visibleLineCount;
        visibleLineCount++;

        const words = line.split(' ');
        if (words.length > 0 && linesToHighlight.has(currentVisibleIndex)) {
          let targetWordIdx = -1;
          for (let i = 0; i < words.length; i++) {
            if (importantWords.has(cleanWord(words[i]))) { targetWordIdx = i; break; }
          }
          if (targetWordIdx === -1) {
            for (let i = 0; i < words.length; i++) {
              const len = cleanWord(words[i]).length;
              if (len > 2 && len <= 5) { targetWordIdx = i; break; }
            }
          }
          if (targetWordIdx === -1) targetWordIdx = Math.floor(Math.random() * words.length);

          const w = words[targetWordIdx];
          words[targetWordIdx] = `<span class="word-highlight">${w}</span>`;

          const alignments = ['align-left', 'align-center', 'align-right'];
          const alignment = isAnimatedWorship ? alignments[currentVisibleIndex % alignments.length] : '';

          const anims = ['anim-left', 'anim-right', 'anim-top', 'anim-bottom'];
          const anim = isAnimatedWorship ? anims[currentVisibleIndex % anims.length] : '';

          return `<span class="${type} ${alignment} ${anim}">${words.join(' ')}</span>`;
        }

        const anims = ['anim-left', 'anim-right', 'anim-top', 'anim-bottom'];
        const anim = isAnimatedWorship ? anims[currentVisibleIndex % anims.length] : '';
        return `<span class="${type} ${anim}">${line}</span>`;
      });
      return htmlLines.join('<br/>');
    }

    function updateRetornoFontSize(baseSize) {
      if (baseSize !== undefined && baseSize !== null) {
        lastEffectiveRetornoFontSize = parseInt(baseSize) || 52;
      }
      const targetBase = lastEffectiveRetornoFontSize;
      if (!targetBase || isNaN(targetBase)) return;

      if (!currentEl) return;

      let targetSize = targetBase;
      const minSize = Math.max(16, Math.floor(targetBase * 0.35));

      currentEl.style.setProperty('font-size', targetSize + 'px', 'important');

      if (lastCaptionFontSize && nextEl) {
        nextEl.style.setProperty('font-size', lastCaptionFontSize + 'px', 'important');
      }

      const vh = window.innerHeight || document.documentElement.clientHeight || 1080;
      const maxOverlayHeight = vh * 0.52;

      const checkOverflow = () => {
        if (currentEl.scrollHeight > maxOverlayHeight) return true;
        if (currentEl.scrollWidth > currentEl.clientWidth + 4) return true;
        return false;
      };

      let iterations = 0;
      while (checkOverflow() && targetSize > minSize && iterations < 35) {
        targetSize -= 2;
        currentEl.style.setProperty('font-size', targetSize + 'px', 'important');
        iterations++;
      }
    }

    window.addEventListener('resize', () => {
      updateRetornoFontSize();
    });

    function applyRetornoTextStyle(data) {
      if (!data) return;

      if (data.textStyle !== undefined && data.textStyle && stageWrapper) {
        currentTextStyle = data.textStyle;
        const classes = Array.from(stageWrapper.classList);
        classes.forEach(c => {
          if (c.startsWith('ts-')) stageWrapper.classList.remove(c);
        });
        stageWrapper.classList.add(data.textStyle);
      }

      if (data.fontFamily !== undefined && currentEl) {
        currentEl.style.fontFamily = data.fontFamily || '';
        if (nextEl) nextEl.style.fontFamily = data.fontFamily || '';
      }

      if (data.fontWeight !== undefined && currentEl) {
        currentEl.style.fontWeight = data.fontWeight || '';
      }

      if (data.fontSize !== undefined && currentEl) {
        lastEffectiveRetornoFontSize = parseInt(data.fontSize) || 52;
      }

      if (data.captionFontSize !== undefined && data.captionFontSize) {
        lastCaptionFontSize = parseInt(data.captionFontSize) || null;
        if (headerEl) headerEl.style.fontSize = data.captionFontSize;
        if (nextEl) nextEl.style.fontSize = data.captionFontSize;
      }

      if (data.linesLimit !== undefined && currentEl) {
        const limit = parseInt(data.linesLimit) || 0;
        if (limit > 0) {
          currentEl.style.display = '-webkit-box';
          currentEl.style.webkitLineClamp = limit;
          currentEl.style.webkitBoxOrient = 'vertical';
          currentEl.style.overflow = 'hidden';
        } else {
          currentEl.style.display = '';
          currentEl.style.webkitLineClamp = '';
          currentEl.style.webkitBoxOrient = '';
          currentEl.style.overflow = '';
        }
      }

      updateRetornoFontSize();
    }

    function applyRetornoBgFit(fitMode) {
      if (bgImage) {
        if (fitMode === 'cover') bgImage.style.backgroundSize = 'cover';
        else if (fitMode === 'contain') bgImage.style.backgroundSize = 'contain';
        else if (fitMode === 'stretch') bgImage.style.backgroundSize = '100% 100%';
        else if (fitMode === 'width') bgImage.style.backgroundSize = '100% auto';
      }

      if (bgVideo) {
        if (fitMode === 'cover') bgVideo.style.objectFit = 'cover';
        else if (fitMode === 'contain') bgVideo.style.objectFit = 'contain';
        else if (fitMode === 'stretch') bgVideo.style.objectFit = 'fill';
        else if (fitMode === 'width') bgVideo.style.objectFit = 'cover';
      }

      const logoImg = document.getElementById('logo-img-ret');
      if (logoImg) {
        if (fitMode === 'cover') logoImg.style.objectFit = 'cover';
        else if (fitMode === 'contain') logoImg.style.objectFit = 'contain';
        else if (fitMode === 'stretch') logoImg.style.objectFit = 'fill';
        else if (fitMode === 'width') logoImg.style.objectFit = 'cover';
      }
    }

    // Restaura background e estilos iniciais do retorno das preferências se existir
    if (window.electronAPI && typeof window.electronAPI.getPref === "function") {
      try {
        const initKind = window.electronAPI.getPref("slideState_bgKindRetorno") || window.electronAPI.getPref("slideState_songs_bgKindRetorno");
        const initUrl = window.electronAPI.getPref("slideState_bgUrlRetorno") || window.electronAPI.getPref("slideState_songs_bgUrlRetorno");
        if (initKind && initUrl) {
          applyRetornoBackground(initKind, initUrl);
        }

        const fitModeRet = window.electronAPI.getPref('slideState_bgFit_retorno') || 'cover';
        applyRetornoBgFit(fitModeRet);
        
        const initLogoUrl = window.electronAPI.getPref("slideState_logoUrl");
        if (initLogoUrl) {
          let objectFitRet = 'cover';
          if (fitModeRet === 'contain') objectFitRet = 'contain';
          else if (fitModeRet === 'stretch') objectFitRet = 'fill';
          const logoLayerRet = document.getElementById('logo-layer');
          if (logoLayerRet) {
              logoLayerRet.innerHTML = `<img id="logo-img-ret" src="${initLogoUrl}" style="width: 100vw; height: 100vh; object-fit: ${objectFitRet}; max-width: none; max-height: none; filter: none;">`;
          }
        }

        applyRetornoTextStyle({
          textStyle: window.electronAPI.getPref('slideState_songs_textStyleRetorno') || window.electronAPI.getPref('slideState_textStyleRetorno') || 'ts-holy-default',
          fontFamily: window.electronAPI.getPref('slideState_songs_fontFamilyRetorno') || window.electronAPI.getPref('slideState_fontFamilyRetorno') || '',
          fontWeight: window.electronAPI.getPref('slideState_songs_fontWeightRetorno') || window.electronAPI.getPref('slideState_fontWeightRetorno') || '',
          fontSize: parseInt(window.electronAPI.getPref('slideState_songs_fontSizeRetorno') || window.electronAPI.getPref('slideState_fontSizeRetorno')) || 52,
          captionFontSize: window.electronAPI.getPref('slideState_songs_captionFontSizeRetorno') || window.electronAPI.getPref('slideState_captionFontSizeRetorno') || 'clamp(13px, 1.4vw, 22px)'
        });
      } catch (err) {
        console.warn('Erro ao restaurar preferências do retorno:', err);
      }
    }

    const blackoutEl = document.getElementById('stage-blackout');
    const logoEl = document.getElementById('logo-layer');
    const alertEl = document.getElementById('stage-alert');
    const alertTextEl = document.getElementById('stage-alert-text');

    let alertTimer = null;

    channel.onmessage = (event) => {
      const msg = event.data;
      if (!msg) return;

      switch (msg.action) {
        case 'PROJECT_SLIDE':
          if (typeof msg.isBlackout !== 'undefined') {
            blackoutEl.classList.toggle('active', !!msg.isBlackout);
          }
          if (typeof msg.isLogo !== 'undefined') {
            if (logoEl) {
              logoEl.classList.toggle('active', !!msg.isLogo);
            }
          }
          if (typeof msg.isClearText !== 'undefined') {
            currentEl.style.opacity = msg.isClearText ? '0' : '1';
          }

          if (typeof msg.cfgRetornoClock !== 'undefined' && topbarEl) {
            topbarEl.style.display = msg.cfgRetornoClock ? 'flex' : 'none';
          }
          if (typeof msg.cfgRetornoCurrent !== 'undefined' && centerEl) {
            centerEl.style.display = msg.cfgRetornoCurrent ? 'flex' : 'none';
          }
          if (typeof msg.cfgRetornoNext !== 'undefined' && footerEl) {
            footerEl.style.display = msg.cfgRetornoNext ? 'flex' : 'none';
          }

          if (msg.bgFitRetorno) {
            applyRetornoBgFit(msg.bgFitRetorno);
          }

          if (msg.bgKindRetorno && msg.bgUrlRetorno) {
            applyRetornoBackground(msg.bgKindRetorno, msg.bgUrlRetorno);
          }

          currentEl.innerHTML = formatDisplayText(msg.text, msg.textStyleRetorno || currentTextStyle);

          const isBibleRetorno = msg.theme === 'bible';
          const bibleRef = msg.reference || msg.caption || msg.subtitle || '';

          if (isBibleRetorno) {
            if (headerEl) {
              headerEl.textContent = bibleRef;
              headerEl.style.display = bibleRef ? '' : 'none';
            }
            if (msg.nextText) {
              nextEl.innerHTML = (msg.nextText).replace(/\n/g, ' • ');
            } else {
              nextEl.textContent = '—';
            }
          } else {
            const songHeader = msg.header || '';
            if (headerEl) {
              headerEl.textContent = songHeader;
              headerEl.style.display = songHeader ? '' : 'none';
            }
            if (msg.nextText) {
              nextEl.innerHTML = (msg.nextText).replace(/\n/g, ' • ');
            } else {
              nextEl.textContent = '—';
            }
          }

          const effectiveLinesLimitRetorno = isBibleRetorno ? '0' : (msg.linesLimit || '0');

          if (msg.textStyleRetorno || msg.fontSizeRetorno || typeof msg.linesLimit !== 'undefined') {
            applyRetornoTextStyle({
              textStyle: msg.textStyleRetorno,
              fontFamily: msg.fontFamilyRetorno,
              fontWeight: msg.fontWeightRetorno,
              fontSize: msg.fontSizeRetorno,
              captionFontSize: msg.captionFontSizeRetorno,
              linesLimit: effectiveLinesLimitRetorno
            });
          } else {
            updateRetornoFontSize(msg.fontSizeRetorno || msg.fontSize || lastEffectiveRetornoFontSize);
          }
          break;

        case 'TOGGLE_LOGO':
          if (logoEl) {
            logoEl.classList.toggle('active', !!msg.active);
          }
          break;
        case 'SET_LOGO':
          const fitModeRet = window.electronAPI ? window.electronAPI.getPref('slideState_bgFit_retorno') || 'cover' : 'cover';
          let objectFitRet = 'cover';
          if (fitModeRet === 'contain') objectFitRet = 'contain';
          else if (fitModeRet === 'stretch') objectFitRet = 'fill';
          if (logoEl) {
            logoEl.innerHTML = `<img id="logo-img-ret" src="${msg.url}" style="width: 100vw; height: 100vh; object-fit: ${objectFitRet}; max-width: none; max-height: none; filter: none;">`;
          }
          break;
        case 'TOGGLE_BLACKOUT':
          blackoutEl.classList.toggle('active', msg.active);
          break;

        case 'TOGGLE_CLEAR_TEXT':
          currentEl.style.opacity = msg.active ? '0' : '1';
          break;

        case 'SHOW_ALERT':
          alertTextEl.textContent = msg.text;
          alertEl.classList.add('visible');
          if (alertTimer) clearTimeout(alertTimer);
          alertTimer = setTimeout(() => {
            alertEl.classList.remove('visible');
          }, (msg.duration || 10) * 1000);
          break;

        case 'CLEAR_ALERT':
          alertEl.classList.remove('visible');
          break;

        case 'SET_BACKGROUND':
          if (!msg.target || msg.target === 'retorno') {
            applyRetornoBackground(msg.kind, msg.url);
          }
          break;
        case 'SET_BG_FIT':
          if (!msg.target || msg.target === 'retorno') {
            applyRetornoBgFit(msg.value);
          }
          break;
        case 'SET_TEXT_STYLE':
          if (msg.target === 'retorno') {
            applyRetornoTextStyle(msg);
          }
          break;
      }
    };

    channel.postMessage({ action: 'RETORNO_CONNECTED', timestamp: Date.now() });
  </script>
</body>
</html>
