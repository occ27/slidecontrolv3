<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 175 175" fill="none" role="img" aria-label="Logo SlideControl">
  <defs>
    <linearGradient id="remote_body_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#F3F4F6;stop-opacity:0.95" />
    </linearGradient>
  </defs>

  <g id="icon_container" transform="translate(10, 10)">
    <rect x="0" y="0" width="120" height="120" rx="24" fill="#5B21B6" />
    <rect x="36" y="36" width="120" height="120" rx="24" fill="#EA580C" fill-opacity="0.92" style="mix-blend-mode: multiply;" />

    <g id="remote_control" transform="translate(50, 18)">
      <rect x="0" y="0" width="64" height="124" rx="16" fill="url(#remote_body_grad)" stroke="#5B21B6" stroke-width="1.5" stroke-opacity="0.3"/>
      
      <g id="dpad" transform="translate(32, 34)">
        <circle cx="0" cy="0" r="22" stroke="#5B21B6" stroke-width="4" fill="none"/>
        <circle cx="0" cy="0" r="7" fill="#5B21B6"/>
        <path d="M0 -18 L-5 -11 H5 Z" fill="#5B21B6" />
        <path d="M0 18 L-5 11 H5 Z" fill="#5B21B6" />
        <path d="M-18 0 L-11 -5 V5 Z" fill="#5B21B6" />
        <path d="M18 0 L11 -5 V5 Z" fill="#5B21B6" />
      </g>

      <g id="nav_buttons" transform="translate(32, 74)">
        <circle cx="-16" cy="0" r="9" fill="#5B21B6"/>
        <path d="M-18 0 L-14 -4 V4 Z" fill="#FFFFFF"/>
        <circle cx="16" cy="0" r="9" fill="#5B21B6"/>
        <path d="M18 0 L14 -4 V4 Z" fill="#FFFFFF"/>
      </g>

      <g id="menu_button" transform="translate(32, 102)">
        <circle cx="0" cy="0" r="9" fill="#5B21B6"/>
        <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
          <line x1="-5" y1="-3" x2="5" y2="-3" />
          <line x1="-5" y1="0" x2="5" y2="0" />
          <line x1="-5" y1="3" x2="5" y2="3" />
        </g>
      </g>
    </g>
  </g>
</svg>