<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 180" width="100%" height="100%" fill="none" role="img" aria-label="Logo SlideControl V3">
  <defs>
    <linearGradient id="remote_body_grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="cyan_glow_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00F0FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0284C7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="violet_grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#A855F7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6B21A8;stop-opacity:1" />
    </linearGradient>
  </defs>

  <g id="icon_container" transform="translate(20, 20)">
    <!-- Quadrado de Fundo: Violeta Cósmico V3 -->
    <rect x="0" y="0" width="120" height="120" rx="26" fill="url(#violet_grad)" />
    <!-- Quadrado Frontal: Ciano Neon V3 com leve transparência -->
    <rect x="36" y="36" width="120" height="120" rx="26" fill="url(#cyan_glow_grad)" fill-opacity="0.9" />

    <!-- Controle Remoto Central -->
    <g id="remote_control" transform="translate(50, 18)">
      <rect x="0" y="0" width="64" height="124" rx="16" fill="url(#remote_body_grad)" stroke="#6B21A8" stroke-width="1.5" stroke-opacity="0.4"/>
      
      <!-- D-Pad Direcional -->
      <g id="dpad" transform="translate(32, 34)">
        <circle cx="0" cy="0" r="22" stroke="#6B21A8" stroke-width="4" fill="none"/>
        <circle cx="0" cy="0" r="7" fill="#6B21A8"/>
        <path d="M0 -18 L-5 -11 H5 Z" fill="#6B21A8" />
        <path d="M0 18 L-5 11 H5 Z" fill="#6B21A8" />
        <path d="M-18 0 L-11 -5 V5 Z" fill="#6B21A8" />
        <path d="M18 0 L11 -5 V5 Z" fill="#6B21A8" />
      </g>

      <!-- Botões de Navegação -->
      <g id="nav_buttons" transform="translate(32, 74)">
        <circle cx="-16" cy="0" r="9" fill="#6B21A8"/>
        <path d="M-18 0 L-14 -4 V4 Z" fill="#FFFFFF"/>
        <circle cx="16" cy="0" r="9" fill="#6B21A8"/>
        <path d="M18 0 L14 -4 V4 Z" fill="#FFFFFF"/>
      </g>

      <!-- Botão Menu Inferior -->
      <g id="menu_button" transform="translate(32, 102)">
        <circle cx="0" cy="0" r="9" fill="#6B21A8"/>
        <g stroke="#FFFFFF" stroke-width="2" stroke-linecap="round">
          <line x1="-5" y1="-3" x2="5" y2="-3" />
          <line x1="-5" y1="0" x2="5" y2="0" />
          <line x1="-5" y1="3" x2="5" y2="3" />
        </g>
      </g>
    </g>
  </g>

  <!-- Tipografia: "Slide" em Branco Puro de Alto Contraste + "Control" em Ciano Neon V3 -->
  <g id="text_container" transform="translate(195, 125)">
    <text font-family="'Space Grotesk', 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="88" letter-spacing="-1">
      <tspan fill="#FFFFFF">Slide</tspan><tspan fill="#00F0FF">Control</tspan>
    </text>
  </g>
</svg>
